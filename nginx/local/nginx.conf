server {
    listen 80;
    server_name localhost;

    # Carbot page proxy — rewrite paths in HTML/JS responses
    location /carbot/ {
        proxy_pass https://carbotai.com/design/;
        proxy_set_header Host carbotai.com;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";  # disable gzip so sub_filter works
        sub_filter '/api/v1' '/carbot-api';
        sub_filter '"/api"' '"/carbot-api"';
        sub_filter '/design/' '/carbot/';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript application/json;
    }

    # Carbot API proxy — note: proxy to /api/ not /api/v1/ because JS baseURL is "/carbot-api" and appends "/v1/..."
    location /carbot-api/ {
        proxy_pass https://carbotai.com/api/;
        proxy_set_header Host carbotai.com;
        proxy_ssl_server_name on;
    }

    # Go backend API
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket support for Vite HMR
    location /ws {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Everything else → Vite dev server
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
