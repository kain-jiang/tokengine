name: Publish Docker image (ttl.sh)

on:
  push:
    branches:
      - 'dev*'
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out (shallow)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Determine version
        id: version
        run: |
          # Generate ttl.sh tag based on branch name
          # Format: ttl.sh/12205599/new-api:<branch>-<MMDD-HHMM>
          # e.g., ttl.sh/12205599/new-api:dev0626-1804 for branch dev0626 at 18:04
          BRANCH="${GITHUB_REF_NAME}"
          TIMESTAMP="$(date +'%m%d')-$(date +'%H%M')"
          TTL_TAG="${BRANCH}-${TIMESTAMP}"
          echo "TTL_TAG=$TTL_TAG" >> $GITHUB_OUTPUT
          echo "TTL_TAG=$TTL_TAG" >> $GITHUB_ENV
          echo "ttl.sh tag: $TTL_TAG for branch: $BRANCH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push single-arch to ttl.sh
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ttl.sh/12205599/new-api:${{ steps.version.outputs.ttl_tag }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output digest
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ttl.sh/12205599/new-api:${{ steps.version.outputs.ttl_tag }}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```'

  create_manifests:
    name: Create multi-arch manifest (ttl.sh)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out (shallow)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Determine version
        id: version
        run: |
          # Generate ttl.sh tag based on branch name
          BRANCH="${GITHUB_REF_NAME}"
          TIMESTAMP="$(date +'%m%d')-$(date +'%H%M')"
          TTL_TAG="${BRANCH}-${TIMESTAMP}"
          echo "TTL_TAG=$TTL_TAG" >> $GITHUB_OUTPUT
          echo "TTL_TAG=$TTL_TAG" >> $GITHUB_ENV

      - name: Create multi-arch manifest for ttl.sh
        run: |
          docker buildx imagetools create \
            -t ttl.sh/12205599/new-api:${{ steps.version.outputs.ttl_tag }} \
            ttl.sh/12205599/new-api:${{ steps.version.outputs.ttl_tag }}-amd64 \
            ttl.sh/12205599/new-api:${{ steps.version.outputs.ttl_tag }}-arm64

      - name: Output manifest digest
        run: |
          echo "### Multi-arch Manifest Digest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ttl.sh/12205599/new-api:${{ steps.version.outputs.ttl_tag }} >> $GITHUB_STEP_SUMMARY
          echo '```'
